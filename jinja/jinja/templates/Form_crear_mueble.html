<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Mueble</title>
    <link rel="icon" href="../static/imagenes/Logo_Axa_asb.png" type="image/x-icon">
    <link rel="stylesheet" href="/static/CSS/styles.css"> 
</head>
<body>

    <header class="encabezado">
        <nav class="navegador_secciones">
            <nav class="nav-links">

                <!--    Enlace a pagina principal   -->
                <a href="{{ url_for('home') }}">
                    <img src="/static/imagenes/Logo_Axa_asb.png" alt="Logo de empresa" class="logo">
                </a>
                <a href="{{url_for('pagina_productos')}}" class="Apartados">Productos</a>
                <a href="{{ url_for('personalizar_muebles') }}" class="Apartados">Personalizacion Muebles</a>

                <a href="#" class="Apartados">Carrito</a>
                <!--    Dropdown del usuario    -->
                <div class="dropdown">
                    <img src="/static/imagenes/15081.png" 
                    alt="Imagen_Log_in" 
                    class="login" 
                    onclick="Menu_login_registro()">
                        
                    {% if session.get("id_usuario") %}
                        <div id="menuLogin" class="dropdown-content">
                            <p>Hola {{session.get("usuario")}}</p><br>
                            <a href="{{url_for('logout')}}">Cerrar sesion</a>
                        </div>
                    
                    {% else %}
                        <div id="menuLogin" class="dropdown-content">
                            <!--Enlace a pagina login-->
                            <a href="{{ url_for('login') }}">Login</a>
                            <!--Enlace a pagina registro-->
                            <a href="{{ url_for('registro') }}">Registrarse</a>
                        </div>
                    {% endif %}
                </div>
            </nav>
        </nav>
    </header>

    <div class="contenedor" style="width: 60%; margin-left: 20%;" >
        <h2>Crear Mueble Personalizado</h2>

        <form action="{{url_for('personalizar_muebles')}}" method="post">
            <div class="Sections">

                <!-- Tipo de mueble -->
                <label for="tipo_mueble">Tipo de mueble:</label><br>
                <select id="tipo_mueble" name="tipo_mueble">
                    <option value="Armario">Armario</option>
                    <option value="Sofa">Sofa</option>
                    <option value="Mesa">Mesa</option>
                    <option value="Sillas">Sillas</option>
                </select><br><br>
                
                <!-- Sección del hogar -->
                <label for="seccion_hogar">Sección del hogar para el que quieres el mueble:</label><br>
                <select id="seccion_hogar" name="seccion_hogar">
                    <option value="Salon">Sala de estar</option>
                    <option value="Aseo">Aseo</option>
                    <option value="Cocina">Cocina</option>
                    <option value="Dormitorio">Dormitorio</option>
                    <option value="Comedor">Comedor</option>
                    <option value="Oficina">Oficina</option>
                    <option value="Terraza">Terraza</option>
                    <option value="Jardin">Jardín</option>
                    <option value="Recibidor">Recibidor</option>
                    <option value="Lavanderia">Lavandería</option>
                </select><br><br>

                <!-- Color del mueble-->
                <label for="color">Color:</label><br>
                <input type="text" id="color" name="color"
                placeholder="Ej: Blanco, Roble, Negro" required><br><br>

                <!-- Dimensiones -->
                <h3>Dimensiones (cm)</h3>

                <label for="ancho">Ancho:</label><br>
                <input type="number" id="ancho" name="ancho"
                min="1" required><br><br>

                <label for="alto">Alto:</label><br>
                <input type="number" id="alto" name="alto"
                min="1" required><br><br>

                <label for="profundidad">Profundidad:</label><br>
                <input type="number" id="profundidad" name="profundidad"
                min="1" required><br><br>

                <!-- Material -->
                <label for="material">Material:</label><br>
                <select id="material" name="material">
                    <option value="Sintetico">Sintetico</option>
                    <option value="Algodon">Algodon</option>
                    <option value="Cuero">Cuero</option>
                    <option value="Madera">Madera</option>
                    <option value="Inox">Acero Inoxidable</option>
                </select><br><br>

                <!-- Descripción -->
                <label for="descripcion">Descripción:</label><br>
                <textarea id="descripcion_mueble" name="descripcion_mueble" style="width: 80%; height: 120px;"
                placeholder="Describe el mueble, estilo, detalles, etc."></textarea><br><br>

                <!-- Precio estimado -->
                <label for="precio_estimado">Precio estimado (€):</label><br>
                <input type="number" id="precio_estimado" name="precio_estimado"
                 min="1" step="0.01" required><br><br>

                <!-- Estado -->
                <label for="estado">Estado:</label><br>
                <select name="estado" id="estado" required>
                    <option value="Nuevo">Nuevo</option>
                    <option value="Segunda mano">Segunda mano</option>
                </select><br><br>

            </div>

            <button type="submit" >
                Guardar Mueble
            </button><br><br>
            {% if mensaje %}
            <h3>{{mensaje}}</h3>
            {% endif %}

        </form>
    </div>

</body>

<script src="../static/Script/Carrusel_anuncios.js"></script>

<script src="../static/Script/Menu_usuario.js"></script>


</html>
