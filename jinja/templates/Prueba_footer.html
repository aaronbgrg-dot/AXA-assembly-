<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/2193d055c9.js" crossorigin="anonymous"></script>
</head>

<style>

    footer {
        background-color: #dc8c1d;
        color: whitesmoke;
        padding: 20px 100px;
        flex-direction: row;
        
    }

    .footer_contenido{
        display: flex;
        justify-content: space-between;
        text-align: center;
        flex-wrap: wrap;
        width: 100%;
        align-items: flex-start;
    }

    .columna_footer{
        width: 30%;
    }

    .columna_footer ul {
        display: grid;
        grid-template-columns: repeat(2, 1fr);  /* Separar en 2 columnas - Ayuda de IA*/
        gap: 10px;
        padding: 0;
    }

    .columna_footer img{
        max-width: 90px;
        border-radius: 5px;
    }

    .pie{
        width: 100%;
        margin-top: center;
        text-align: center;
    }


</style>

<body>

    <footer>
        <div class="footer_contenido">
            <div class="columna_footer">
                <u><h3>Proovedores: </h3></u>
                <ul> 
                    <li><img src="../static/imagenes/DHL_Logo.jpg" alt="Logo DHL"></li>
                    <li><img src="../static/imagenes/Kartra-Review_logo.jpg" alt="Logo Kartra"/></li>
                    <li><img src="../static/imagenes/Correos_logo.jpg" alt="Logo correos"/></li>
                    <li><img src="../static/imagenes/Mollari_logo.jpg" alt="Logo Mollarri Garraioak"/></li>
                    <li><img src="../static/imagenes/Leroy_Merlin_logo.png" alt="Logo Leroy Merlin"/></li>
                    <li><img src="../static/imagenes/Equilan-logo.jpg" alt="Logo Equilan"/></li>
                </ul>
            </div>

            <div class="columna_footer">
                <u><h3>Contáctanos:</h3></u>
                <p>Correo: a_assembly@gmail.com</p>
                <p>Direccion: Berio Pasalekua 50 - San Sebastian/Donosti, Guipuzcoa - España</p>
                
            </div>

            <div class="columna_footer">
                <u><h3>Siguenos en:</h3></u>
                <a href=""><i class="fa-brands fa-instagram" style="font-size: 60px; color: whitesmoke;"></i></a>

            </div>
            
            <p class="pie">© 2026 Axa Assembly</p>
        </div>
    </footer>
</body>
</html>
