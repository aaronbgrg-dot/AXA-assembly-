<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axa-Login</title>
    <link rel="stylesheet" href="../Axa_assembly/PagWeb.css"> 
</head>
<body>
    <header class="encabezado">
        <nav class="navegador_secciones">
            <h2>AXA ASSEMBLY</h2>
            <nav class="nav-links">
                
                <!--    Enlace a pagina principal   -->
                <a href="{ url_for('pagina_principal') }">
                    <img src="..\Axa_assembly/Imagenes/placeholderLogo.png" alt="Logo de empresa" class="logo">
                </a>
                <a href="#" class="Apartados">Productos</a>
                <a href="{ url_for('Mueble_personalizado') }" class="Apartados">Personalizacion Muebles</a>
                <a href="#" class="Apartados">Carrito</a>
                <!--    Dropdown del usuario    -->
                <div class="dropdown">
                    <img src="..\Axa_assembly/Imagenes/15081.png" 
                        alt="Imagen_Log_in" 
                        class="login" 
                        onclick="Menu_login_registro()">

                    <div id="menuLogin" class="dropdown-content">
                        <!--Enlace a pagina login-->
                        <a href="{{ url_for('login') }}">Login</a>
                        <!--Enlace a pagina registro-->
                        <a href="{{ url_for('registro') }}">Registrarse</a>
                    </div>
                </div>
            </nav>
        </nav>
    </header>

        <div class="contenedor" style="max-width: 50%;">
            <h3>Inicio de sesion</h3><br>
            <p>Usuario</p>
            <input type="text" name="Nom_usuario" id="Nom_usuario">

            <br><br><p>Contraseña</p>
            <input type="text" name="Contrase_usuario" id="Contrase_usuario">

            <button type="submit" id="btn_login">Iniciar sesion</button>
        </div>
</body>

<script>

    function Menu_login_registro() {
        const menu = document.getElementById("menuLogin");
        //ayuda de la IA para saber como poner el dropdown solo cuando el usuario haga click en el icono
        menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

  // Cerrar el menú si se hace clic fuera
  window.onclick = function(event) {
        if (!event.target.matches('.login')) {
            //Fin uso IA
            document.getElementById("menuLogin").style.display = "none";
        }
    }
</script>

</html>
